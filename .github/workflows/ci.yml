name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment names the major version); Dependabot keeps them current.
jobs:
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: wrapper
    strategy:
      fail-fast: false
      matrix:
        # 21 is the supported minimum. Do not use 25.0.0-25.0.2 or 26.0.0: JDK-8369227 stalls virtual threads
        # (see docs/adr/0001-http-stack.md); "25" here resolves to the latest 25.0.x, which includes the fix.
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build, unit and integration tests
        run: ./gradlew build --stacktrace
      - name: Validate the shipped configurations
        run: |
          ./gradlew -q :app:installDist
          for f in config/routeplane.yaml config/examples/*.yaml; do
            case "$f" in *custom-policy.yaml) continue;; esac   # needs a custom policy on the class path
            ADMIN_TOKEN=0123456789abcdef-ci ADMIN_KEYSTORE=gradle/wrapper/gradle-wrapper.properties KS_PASS=x \
              app/build/install/routeplane/bin/routeplane validate --config "$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  experiment-smoke:
    name: Experiment smoke run
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Short real experiment (not a benchmark: shared CI hardware)
        run: ./gradlew :benchmarks:run --args="run --scenario experiments/scenarios/basic.yaml --out build/smoke --runs 1 --rates 100 --warmup 5s --duration 5s"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-report
          path: build/smoke/

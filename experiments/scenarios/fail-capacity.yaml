id: fail-capacity
description: >-
  Upstream a loses capacity: its concurrency limit drops from unlimited to 4 (about half of what its share of the traffic needs) from 8 s to 24 s; excess requests are answered 503 immediately.
kind: failure
upstreams:
  - {id: a, profile: {delayMs: 40, jitterMs: 10, payloadMin: 1024, payloadMax: 1024}}
  - {id: b, profile: {delayMs: 40, jitterMs: 10, payloadMin: 1024, payloadMax: 1024}}
  - {id: c, profile: {delayMs: 40, jitterMs: 10, payloadMin: 1024, payloadMax: 1024}}
proxy:
  jvmOptions: ["-Xms256m", "-Xmx512m"]
  base: |
    server:
      host: 127.0.0.1
      port: ${PROXY_PORT}
      maxConcurrentRequests: 20000
    admin:
      host: 127.0.0.1
      port: ${ADMIN_PORT}
    logging:
      level: warn
      accessLog: {enabled: false}
    routes:
      - id: api
        match: {pathPrefix: /api}
        policy: round-robin
        upstreams:
          - {id: a, url: "http://127.0.0.1:${UP_A}", maxConcurrent: 3000}
          - {id: b, url: "http://127.0.0.1:${UP_B}", maxConcurrent: 3000}
          - {id: c, url: "http://127.0.0.1:${UP_C}", maxConcurrent: 3000}
  variants:
    baseline: |
      timeouts: {connect: 500ms, response: 1s, request: 1500ms}
    resilient: |
      timeouts: {connect: 500ms, response: 1s, request: 1500ms}
      retry: {maxAttempts: 2, methods: [GET], backoff: {initial: 5ms, max: 50ms, jitter: full}, budget: {ratio: 0.2, minRetriesPerSecond: 20, window: 10s}}
      circuitBreaker: {failureRateThreshold: 50, minimumRequests: 20, slidingWindow: {type: count, size: 50}, openDuration: 3s, halfOpenMaxProbes: 3, recoverySuccessThreshold: 3}
      health: {passive: {consecutiveFailures: 5, ejectionTime: 3s}}
load:
  path: /api/x
  rate: 500
  warmup: 8s
  duration: 40s
  timeout: 4s
  maxInFlight: 3000
runs: 2
timeline:
  - {at: 8s, upstream: a, set: {maxConcurrency: 4, queueWaitMs: 0}, label: "a capacity reduced"}
  - {at: 24s, upstream: a, set: {maxConcurrency: 0}, label: "a capacity restored", recovery: true}

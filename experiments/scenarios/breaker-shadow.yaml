id: breaker-shadow
description: >-
  Weighted routing with circuit breaker and passive health, plus 25% shadowing.
kind: steady
upstreams:
  - {id: a, profile: {delayMs: 5, jitterMs: 5, payloadMin: 1024, payloadMax: 1024}}
  - {id: b, profile: {delayMs: 5, jitterMs: 5, payloadMin: 1024, payloadMax: 1024}}
  - {id: c, profile: {delayMs: 5, jitterMs: 5, payloadMin: 1024, payloadMax: 1024}}
  - {id: s, profile: {delayMs: 5, jitterMs: 5, payloadMin: 1024, payloadMax: 1024}}
proxy:
  jvmOptions: ["-Xms256m", "-Xmx512m"]
  config: |
    server:
      host: 127.0.0.1
      port: ${PROXY_PORT}
      maxConcurrentRequests: 20000
    admin:
      host: 127.0.0.1
      port: ${ADMIN_PORT}
    logging:
      level: warn
      accessLog: {enabled: false}
    routes:
      - id: api
        match: {pathPrefix: /api}
        policy: weighted-round-robin
        upstreams:
          - {id: a, url: "http://127.0.0.1:${UP_A}", weight: 50, maxConcurrent: 3000}
          - {id: b, url: "http://127.0.0.1:${UP_B}", weight: 30, maxConcurrent: 3000}
          - {id: c, url: "http://127.0.0.1:${UP_C}", weight: 20, maxConcurrent: 3000}
        timeouts: {connect: 1s, response: 2s, request: 3s}
        circuitBreaker: {failureRateThreshold: 50, minimumRequests: 20, slidingWindow: {type: count, size: 100}, openDuration: 5s, halfOpenMaxProbes: 3, recoverySuccessThreshold: 3}
        health: {passive: {consecutiveFailures: 5, ejectionTime: 5s}}
        shadow:
          targets:
            - {id: s1, url: "http://127.0.0.1:${UP_S}", samplePercent: 25, timeout: 2s, maxConcurrent: 32, queueCapacity: 512}
load:
  path: /api/x
  rates: [100, 500, 1000, 2500, 5000, 10000]
  warmup: 15s
  duration: 10s
  timeout: 5s
  maxInFlight: 3000
runs: 3
highRateRuns: 1
